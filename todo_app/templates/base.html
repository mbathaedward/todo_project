{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>block content</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <h1>{{ user.username }} is autheticated</h1>


        <nav>
    <ul>
        {% if user.is_authenticated %}
            <li><a class="btn" href="{% url 'auth:logout' %}">Logout</a></li>
        {% else %}
            <li><a class="btn" href="{% url 'auth:login' %}">Login</a></li>
        {% endif %}
    </ul>
</nav>

    </header>          
             
                {% block content %}

                {% endblock content %}
             
             
              <footer class="footer">
        <p>&copy; {{ now|date:"Y" }} Todo App</p>
    </footer>

    
</body>
</html>
