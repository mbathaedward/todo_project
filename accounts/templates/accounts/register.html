{% extends 'base.html' %}
{% load static %}

{% block content %}
<h1>Register Form</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Register Now</button>
</form>
<p>Already have an account? <a href="{% url 'auth:login' %}">Login here</a></p>
{% endblock %}
